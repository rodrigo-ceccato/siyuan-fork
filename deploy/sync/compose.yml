name: siyuan-sync

services:
  s3:
    image: chrislusf/seaweedfs:4.48
    user: "${SYNC_UID:?Run setup.py first}:${SYNC_GID:?Run setup.py first}"
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -bucket=siyuan
      - -s3.config=/run/secrets/s3_config
    ports:
      - "${SYNC_BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-8333}:8333"
    volumes:
      - ./s3-data:/data
    secrets:
      - s3_config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 60s

  backup:
    profiles: [tools]
    build:
      context: ./backup
    environment:
      BORG_REPO: /borg/repository
      BORG_PASSCOMMAND: cat /run/secrets/borg_passphrase
      BORG_CACHE_DIR: /cache
      BORG_SECURITY_DIR: /cache/security
    volumes:
      - ./data:/data:ro
      - ./s3-data:/s3-data:ro
      - .:/deployment:ro
      - ${BORG_DIRECTORY:-./borg}:/borg
      - ./borg-cache:/cache
      - ./restore:/restore
    secrets:
      - borg_passphrase
    security_opt:
      - no-new-privileges:true

secrets:
  s3_config:
    file: ./secrets/s3.json
  borg_passphrase:
    file: ./secrets/borg-passphrase
